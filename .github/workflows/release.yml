name: Release

on:
    schedule:
        - cron: '0 0 * * *'
    workflow_dispatch:

jobs:
    check-for-commits:
        runs-on: ubuntu-latest
        outputs:
            ci_skip: ${{ steps.check_commits.outputs.ci_skip }}
        steps:
            - name: Checkout code
              uses: actions/checkout@v2

            - name: Check for new commits and CI skip
              id: check_commits
              run: |
                  git fetch origin main
                  latest_commit_message=$(git log -1 --pretty=%B HEAD)
                  echo "Latest commit message: $latest_commit_message"

                  if [[ "$latest_commit_message" == *"[ci skip]"* || "$latest_commit_message" == *"[skip ci]"* ]]; then
                      echo "CI skip detected in the latest commit message."
                      echo "ci_skip=true" >> $GITHUB_OUTPUT
                  else
                      echo "No CI skip detected."
                      echo "ci_skip=false" >> $GITHUB_OUTPUT
                  fi

    release:
        permissions:
            id-token: write # Required for OIDC to publish to npm
            contents: write # Required to push commits and tags to git

        runs-on: ubuntu-latest
        needs: check-for-commits
        if: ${{ needs.check-for-commits.outputs.ci_skip == 'false' }}
        outputs:
            tag_name: ${{ steps.remember_tag.outputs.tag_name }}
        steps:
            - uses: actions/checkout@v3

            - name: Prepare repository
              run: git fetch --unshallow --tags

            - name: Use Node.js
              uses: actions/setup-node@v3
              with:
                  node-version-file: .node-version

            - name: Install dependencies
              run: npm ci

            - name: Set Git identity
              run: |
                  git config --global user.email "dax@duckduckgo.com"
                  git config --global user.name "Dax the Deployer"

            - name: Create Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  npm run release

            - name: Remember git tag
              id: remember_tag
              run: echo "tag_name=$(git describe --exact-match --tags)" >> "$GITHUB_OUTPUT"

    # ------------------------------------------------------------------------------
    # Retrieve the corresponding Release data from the GitHub API
    # ------------------------------------------------------------------------------
    get_release_info:
        needs: release
        if: ${{ needs.release.outputs.tag_name != '' }}
        uses: ./.github/workflows/get-release-info.yml
        with:
            tag_name: ${{ needs.release.outputs.tag_name }}

    # ------------------------------------------------------------------------------
    # Create initial Asana subtasks
    # ------------------------------------------------------------------------------
    create_asana_tasks:
        needs:
            - get_release_info
            - release
        runs-on: ubuntu-latest
        outputs:
            task-gid: ${{ steps.create-asana-tasks.outputs.TASK_GID }}
        env:
            TAG: ${{ needs.release.outputs.tag_name }}
            RELEASE_URL: ${{ needs.get_release_info.outputs.release-url }}
            RELEASE_NOTES: ${{ needs.get_release_info.outputs.release-notes }}
        steps:
            # --- Setup ---
            - uses: actions/checkout@v3
              with:
                  path: autoconsent/
            - uses: ./autoconsent/.github/actions/setup-release-scripts
            # --- Effect ---
            - name: Create Asana Tasks
              id: create-asana-tasks
              env:
                  ASANA_ACCESS_TOKEN: ${{ secrets.ASANA_ACCESS_TOKEN }}
              run: |
                  RELEASE_TASK_GID="$(node ./autoconsent/ci/asana-create-release-task.js)"
                  echo "TASK_GID=$RELEASE_TASK_GID" >> "$GITHUB_OUTPUT"

    # ------------------------------------------------------------------------------
    # Check whether the release changes library code, which only reaches users
    # through app updates: any of its PRs labelled needs-code-update.
    # ------------------------------------------------------------------------------
    check-code-update:
        needs: release
        if: ${{ needs.release.outputs.tag_name != '' }}
        runs-on: ubuntu-latest
        outputs:
            needed: ${{ steps.check.outputs.needed }}
        steps:
            - uses: actions/checkout@v3
              with:
                  fetch-depth: 0
            - name: Check the release's PRs for needs-code-update
              id: check
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ needs.release.outputs.tag_name }}
              run: |
                  previous="$(git describe --tags --abbrev=0 "$TAG^")"
                  needed=false
                  for sha in $(git rev-list "$previous..$TAG"); do
                      # Fail open: an unneeded propagation only updates the open app PRs.
                      labels="$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" --jq '.[].labels[].name')" || {
                          echo "Could not read the PRs for $sha; propagating to be safe."
                          needed=true
                          continue
                      }
                      if grep -qx 'needs-code-update' <<< "$labels"; then
                          echo "$sha is from a PR labelled needs-code-update."
                          needed=true
                      fi
                  done
                  echo "needed=$needed" >> "$GITHUB_OUTPUT"

    # ------------------------------------------------------------------------------
    # Open or update the app PRs. Each app's PR uses a fixed branch, so a release
    # updates the open PR rather than opening another.
    # ------------------------------------------------------------------------------
    app-release:
        name: Propagate code changes to the apps
        needs:
            - release
            - create_asana_tasks
            - check-code-update
        if: ${{ needs.check-code-update.outputs.needed == 'true' }}
        uses: ./.github/workflows/ddg-release.yml
        secrets: inherit
        with:
            tag_name: ${{ needs.release.outputs.tag_name }}
            release_task_url: https://app.asana.com/1/137249556945/project/1201844467387842/task/${{ needs.create_asana_tasks.outputs.task-gid }}

    # ------------------------------------------------------------------------------
    # Create PR to privacy-configuration repository
    # ------------------------------------------------------------------------------
    rule-release:
        name: Propagate rules to privacy config
        needs:
            - release
            - create_asana_tasks
        uses: ./.github/workflows/privacy-config-pr.yml
        secrets: inherit
        with:
            tag_name: ${{ needs.release.outputs.tag_name }}
            asana_task_gid: ${{ needs.create_asana_tasks.outputs.task-gid }}
